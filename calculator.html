<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор стоимости видеосъёмки | Yelyginn</title>
    <meta name="description" content="Рассчитайте стоимость видеосъёмки онлайн: тип съёмки, смены, команда, монтаж, срочность. Прозрачная смета и мгновенная заявка. Нижний Новгород." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://yelyginn.ru/calculator" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yelyginn.ru/calculator" />
    <meta property="og:title" content="Калькулятор стоимости видеосъёмки | Yelyginn" />
    <meta property="og:description" content="Соберите смету под свой проект за минуту и отправьте заявку." />
    <meta property="og:locale" content="ru_RU" />
    <style>
      :root {
        --red: #fe2c1f;
        --black: #0a0a0a;
        --panel: #121212;
        --panel-2: #181818;
        --white: #f5f5f4;
        --gray: #8e8e8c;
        --line: rgba(255, 255, 255, 0.1);
        --line-soft: rgba(255, 255, 255, 0.06);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--black);
        color: var(--white);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      a { color: inherit; text-decoration: none; }

      .calc-wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 80px; }

      /* Top bar */
      .calc-top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 28px; }
      .calc-logo { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
      .calc-logo span { color: var(--red); }
      .calc-back { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); transition: color 0.2s; }
      .calc-back:hover { color: var(--white); }

      /* Header */
      .calc-eyebrow { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--red); margin-bottom: 14px; }
      .calc-title { font-size: clamp(30px, 5vw, 56px); line-height: 1.0; letter-spacing: -0.03em; font-weight: 800; margin: 0 0 16px; text-transform: uppercase; }
      .calc-title span { color: var(--red); }
      .calc-lead { color: rgba(255,255,255,0.62); max-width: 60ch; font-size: clamp(15px, 1.6vw, 18px); margin: 0 0 36px; }

      /* Layout: form + sticky summary */
      .calc-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
      @media (min-width: 980px) { .calc-grid { grid-template-columns: 1.55fr 1fr; gap: 32px; align-items: start; } }

      .calc-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 16px; padding: clamp(18px, 3vw, 30px); }
      .calc-section + .calc-section { margin-top: 30px; }
      .calc-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-bottom: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .calc-label b { color: var(--white); font-weight: 600; letter-spacing: normal; text-transform: none; font-size: 13px; }

      /* Type grid */
      .calc-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      @media (max-width: 640px) { .calc-types { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .calc-type {
        appearance: none; cursor: pointer; text-align: left;
        background: var(--panel-2); border: 1px solid var(--line); color: rgba(255,255,255,0.78);
        border-radius: 10px; padding: 12px 13px; font-size: 12.5px; font-weight: 500; line-height: 1.25;
        transition: transform 0.15s ease, border-color 0.2s, background 0.2s, color 0.2s;
      }
      .calc-type:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.25); }
      .calc-type[data-active="true"] { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }

      /* Slider */
      .calc-slider-row { display: flex; align-items: center; gap: 16px; }
      .calc-range { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.14); outline: none; }
      .calc-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red); cursor: pointer; border: 3px solid var(--black); box-shadow: 0 0 0 1px var(--red); }
      .calc-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--red); cursor: pointer; border: 3px solid var(--black); }
      .calc-days-val { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
      .calc-days-val b { font-size: 22px; font-weight: 800; }
      .calc-days-val span { color: var(--gray); font-size: 12px; }

      /* Service rows */
      .calc-rows { display: flex; flex-direction: column; gap: 2px; }
      .calc-row {
        display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px;
        background: var(--panel-2); border: 1px solid transparent; cursor: pointer; transition: border-color 0.18s, background 0.18s;
      }
      .calc-row:hover { border-color: var(--line); }
      .calc-row[data-on="true"] { border-color: rgba(254,44,31,0.45); background: rgba(254,44,31,0.06); }
      .calc-check {
        flex: 0 0 auto; width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.28);
        display: grid; place-items: center; transition: background 0.15s, border-color 0.15s;
      }
      .calc-row[data-on="true"] .calc-check { background: var(--red); border-color: var(--red); }
      .calc-check svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s; }
      .calc-row[data-on="true"] .calc-check svg { opacity: 1; }
      .calc-row-name { flex: 1; font-size: 13.5px; color: rgba(255,255,255,0.9); }
      .calc-row-unit { font-size: 10.5px; color: var(--gray); letter-spacing: 0.04em; }
      .calc-row-price { flex: 0 0 auto; font-size: 12.5px; font-weight: 700; color: rgba(255,255,255,0.92); white-space: nowrap; font-variant-numeric: tabular-nums; }

      /* Toggle (urgency) */
      .calc-toggle { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-soft); cursor: pointer; }
      .calc-toggle[data-on="true"] { border-color: rgba(254,44,31,0.45); }
      .calc-switch { flex: 0 0 auto; width: 44px; height: 26px; border-radius: 99px; background: rgba(255,255,255,0.15); position: relative; transition: background 0.2s; }
      .calc-toggle[data-on="true"] .calc-switch { background: var(--red); }
      .calc-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
      .calc-toggle[data-on="true"] .calc-switch::after { transform: translateX(18px); }
      .calc-toggle-txt b { display: block; font-size: 13.5px; }
      .calc-toggle-txt span { font-size: 12px; color: var(--gray); }

      /* Inputs */
      .calc-field { margin-bottom: 14px; }
      .calc-input, .calc-textarea {
        width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
        color: var(--white); font-size: 14px; padding: 13px 14px; outline: none; font-family: inherit;
        transition: border-color 0.18s;
      }
      .calc-input:focus, .calc-textarea:focus { border-color: var(--red); }
      .calc-textarea { resize: vertical; min-height: 84px; }
      .calc-hint { font-size: 11.5px; color: var(--gray); margin-top: 6px; }

      /* Discount badge */
      .calc-disc { margin-top: 10px; padding: 12px 14px; border-radius: 9px; background: rgba(254,44,31,0.08); border: 1px solid rgba(254,44,31,0.3); font-size: 13px; display: none; }
      .calc-disc[data-show="true"] { display: block; }
      .calc-disc b { color: var(--red); }

      /* Summary */
      .calc-summary { position: sticky; top: 24px; }
      .calc-sum-type { font-size: 12px; color: var(--gray); letter-spacing: 0.04em; }
      .calc-sum-line { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
      .calc-sum-line span:first-child { color: rgba(255,255,255,0.7); }
      .calc-sum-line b { font-variant-numeric: tabular-nums; }
      .calc-sum-disc b { color: var(--red); }
      .calc-total { margin-top: 18px; }
      .calc-total-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); }
      .calc-total-val { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .calc-total-strike { color: var(--gray); text-decoration: line-through; font-size: 15px; font-weight: 600; margin-top: 4px; }
      .calc-note { font-size: 11.5px; color: var(--gray); margin-top: 12px; line-height: 1.5; }

      /* CTA */
      .calc-cta {
        display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        background: var(--red); color: #fff; border: none; cursor: pointer; font-family: inherit;
        font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
        padding: 17px 24px; border-radius: 10px; margin-top: 20px; transition: opacity 0.2s, transform 0.1s;
      }
      .calc-cta:hover { opacity: 0.92; }
      .calc-cta:active { transform: scale(0.99); }
      .calc-cta:disabled { opacity: 0.55; cursor: not-allowed; }
      .calc-cta-ghost { background: transparent; border: 1px solid var(--line); color: rgba(255,255,255,0.8); }

      /* Success */
      .calc-success { text-align: center; padding: 18px 6px 6px; }
      .calc-success-mark { width: 56px; height: 56px; border-radius: 50%; background: rgba(254,44,31,0.12); border: 1px solid var(--red); display: grid; place-items: center; margin: 0 auto 16px; }
      .calc-success h3 { margin: 0 0 8px; font-size: 20px; }
      .calc-success p { margin: 0 0 18px; color: var(--gray); font-size: 13.5px; }

      .calc-err { color: #ff6b5e; font-size: 12.5px; margin-top: 10px; text-align: center; }
    </style>
    <link rel="stylesheet" href="/site-skin.css" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/calculator/main.tsx"></script>
  </body>
</html>
