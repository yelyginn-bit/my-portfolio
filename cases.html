<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кейсы видеопродакшна — задача, решение, результат | YELYGINN</title>
    <meta name="description" content="Кейсы видеопродакшна в Нижнем Новгороде: задача, решение и результат. Опубликованные проекты Юрия Елыгина для брендов и бизнеса." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://yelyginn.ru/cases" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yelyginn.ru/cases" />
    <meta property="og:title" content="Кейсы — Yelyginn видеопродакшн" />
    <meta property="og:description" content="Реальные проекты: задача, решение, результат." />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root { --red:#ef3f32; --orange:#ff5a1f; --violet:#7c5cff; --c-text:#101010; --panel:#fff; --c-bg:#f4f4ef; --gray:#66665f; --line:rgba(16,16,16,0.22); --line-soft:rgba(16,16,16,0.1); color-scheme:light; }
      *{box-sizing:border-box;} html,body{margin:0;padding:0;}
      body{background:var(--c-bg);color:var(--c-text);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;background-image:linear-gradient(rgba(16,16,16,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,16,16,.035) 1px,transparent 1px);background-size:48px 48px;}
      a{color:inherit;text-decoration:none;}
      .c-wrap{width:min(1720px,calc(100% - clamp(20px,4vw,64px)));margin:0 auto;padding:16px 0 96px;}
      .c-top{position:sticky;top:10px;z-index:10;display:grid;grid-template-columns:56px 1fr max-content max-content;align-items:center;margin-bottom:clamp(72px,11vw,160px);border:1px solid var(--line);border-radius:19px;overflow:hidden;background:rgba(244,244,239,.9);box-shadow:0 16px 52px rgba(20,20,18,.1);backdrop-filter:blur(18px);}
      .c-logo{height:50px;display:grid;place-items:center;border-radius:13px;background:var(--c-text);color:var(--c-bg);font-size:0;font-weight:900;}.c-logo::after{content:"Y";font-size:16px}.c-logo span{display:none;}
      .c-nav{height:50px;display:flex;align-items:stretch;font:680 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text);}
      .c-nav a{flex:1;display:grid;place-items:center;padding:0 14px;border-right:1px solid var(--line-soft);white-space:nowrap;}.c-nav a:hover,.c-nav a[aria-current="page"]{background:#fff;}.c-status,.c-contact{height:50px;display:grid;place-items:center;padding:0 14px;border-left:1px solid var(--line-soft);font:680 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}.c-status{color:var(--gray)}.c-contact{color:#fff;background:var(--c-text)}
      .c-eyebrow{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--violet);margin:0 0 24px;}
      .c-title{max-width:14ch;font-size:clamp(48px,9vw,146px);line-height:.82;letter-spacing:-.075em;font-weight:900;text-transform:uppercase;margin:0 0 clamp(56px,9vw,120px);}
      .c-title span{display:block;color:var(--red);font-family:Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.06em;}
      .c-list{display:flex;flex-direction:column;gap:16px;}
      .c-case{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,52px);box-shadow:0 18px 50px rgba(20,20,18,.05);}
      .c-case h2{font-size:clamp(26px,4vw,58px);line-height:.95;margin:0 0 8px;letter-spacing:-.045em;text-transform:uppercase;}
      .c-client{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--violet);letter-spacing:.12em;text-transform:uppercase;margin-bottom:28px;}
      .c-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
      .c-block{padding-top:16px;border-top:1px solid var(--line)}
      .c-block-label{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);margin-bottom:10px;}
      .c-block p{margin:0;font-size:14px;color:var(--gray);line-height:1.65;white-space:pre-wrap;}
      .c-link{display:inline-flex;margin-top:16px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);}
      .c-empty{position:relative;overflow:hidden;color:var(--gray);padding:clamp(36px,7vw,90px);border:1px solid var(--line);background:#fff;font-size:clamp(18px,2.2vw,30px);}.c-empty::before{content:"NO PUBLISHED CASES / PORTFOLIO IS LIVE";display:block;margin-bottom:28px;color:var(--violet);font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;}
      .c-cta{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
      .c-btn{min-height:60px;display:grid;place-items:center;background:var(--c-text);color:#fff;border-radius:14px;padding:14px 24px;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;}
      .c-btn:first-child{background:var(--orange);color:var(--c-text)}.c-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--c-text);}
      @media(max-width:1100px){.c-status{display:none}}@media(max-width:900px){.c-top{grid-template-columns:48px 1fr max-content}.c-logo{height:46px}.c-nav a:nth-child(n+4){display:none}.c-contact{height:46px}.c-title{margin-top:80px}.c-blocks{grid-template-columns:1fr}.c-cta{grid-template-columns:1fr}}
      @media(max-width:520px){.c-wrap{width:min(100% - 20px,1720px)}.c-nav a{padding:0 7px;font-size:8px}.c-title{font-size:clamp(44px,16vw,74px)}.c-empty{padding:28px 20px}}
    </style>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/site-skin.css" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cases/main.tsx"></script>
  </body>
</html>
