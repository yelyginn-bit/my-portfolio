<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фотосъёмка для брендов и бизнеса | ELYGIN PHOTO</title>
    <meta
      name="description"
      content="Фотосъёмка для брендов, бизнеса, событий и соцсетей в Нижнем Новгороде. Портреты, репортаж и визуальный контент."
    />
    <meta name="robots" content="index,follow" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f4;
        color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .dot-grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image: radial-gradient(circle, rgba(10, 10, 10, 0.18) 0.9px, transparent 0.9px);
        background-size: 32px 32px;
      }

      main {
        min-height: 100vh;
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 0;
        position: relative;
      }

      .badge {
        width: 192px;
        height: 192px;
        border-radius: 999px;
        border: 1px dashed rgba(10, 10, 10, 0.24);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 48px;
      }

      .badge-mark {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: #fe2c1f;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(44px, 8vw, 112px);
        line-height: 0.95;
        text-transform: uppercase;
        letter-spacing: -0.045em;
        font-weight: 800;
      }

      h1 span {
        color: #fe2c1f;
      }

      p {
        margin: 0;
        max-width: 760px;
        font-size: clamp(24px, 2.3vw, 40px);
        line-height: 1.08;
        font-weight: 700;
      }

      .back {
        margin-top: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 0 32px;
        border-radius: 999px;
        border: 1px solid rgba(10, 10, 10, 0.14);
        color: #0a0a0a;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.3em;
        font-weight: 500;
        transition: all 0.35s ease;
      }

      .back:hover {
        background: #0a0a0a;
        color: #ffffff;
      }

      @media (max-width: 768px) {
        .badge {
          width: 148px;
          height: 148px;
          margin-bottom: 36px;
        }

        p {
          font-size: clamp(20px, 6vw, 30px);
        }
      }
    </style>
  </head>
  <body>
    <div class="dot-grid" aria-hidden="true"></div>
    <main>
      <div class="badge" aria-hidden="true">
        <div class="badge-mark"></div>
      </div>
      <h1>Фото<br /><span>скоро добавлю</span></h1>
      <p>
        Я тоже снимаю фото: портреты, репортаж и контент для брендов.
        Скоро здесь появятся лучшие серии и отдельные съёмки.
      </p>
      <a class="back" href="/">Вернуться к видео</a>
    </main>
  </body>
</html>
