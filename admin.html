<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка | Yelyginn</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        --red: #fe2c1f; --black: #0a0a0a; --panel: #121212; --panel-2: #181818;
        --white: #f5f5f4; --gray: #8e8e8c; --line: rgba(255,255,255,0.1); --line-soft: rgba(255,255,255,0.06);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--black); color: var(--white); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
      a { color: inherit; text-decoration: none; }

      .adm-wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 80px; }
      .adm-top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; }
      .adm-logo { font-size: 15px; font-weight: 800; }
      .adm-logo span { color: var(--red); }
      .adm-link { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); cursor: pointer; }
      .adm-link:hover { color: var(--white); }

      .adm-title { font-size: clamp(24px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; margin: 0 0 22px; }
      .adm-title span { color: var(--red); }

      /* Login */
      .adm-login { max-width: 360px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; padding: 26px; }
      .adm-input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--white); font-size: 15px; padding: 13px; outline: none; font-family: inherit; }
      .adm-input:focus { border-color: var(--red); }
      .adm-btn { width: 100%; margin-top: 12px; background: var(--red); color: #fff; border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 14px; border-radius: 9px; }
      .adm-btn:hover { opacity: 0.92; }
      .adm-err { color: #ff6b5e; font-size: 12.5px; margin-top: 10px; }
      .adm-hint { color: var(--gray); font-size: 12px; margin-top: 14px; line-height: 1.5; }

      /* Tabs */
      .adm-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
      .adm-tab { background: var(--panel-2); border: 1px solid var(--line); color: rgba(255,255,255,0.7); border-radius: 99px; padding: 9px 16px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
      .adm-tab[data-active="true"] { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
      .adm-count { opacity: 0.7; font-variant-numeric: tabular-nums; }

      /* Table */
      .adm-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); padding: 13px 16px; border-bottom: 1px solid var(--line-soft); font-weight: 600; }
      td { padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      .adm-mono { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .adm-pill { display: inline-block; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: rgba(255,255,255,0.75); }
      .adm-pill.red { border-color: var(--red); color: var(--red); }
      .adm-empty { padding: 40px 16px; text-align: center; color: var(--gray); font-size: 13.5px; }
      .adm-note { font-size: 12px; color: var(--gray); margin-top: 14px; line-height: 1.6; }
      .adm-note code { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 6px; color: rgba(255,255,255,0.85); }

      /* Галереи */
      .gal-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
      @media (max-width: 760px) { .gal-layout { grid-template-columns: 1fr; } }
      .gal-list { display: flex; flex-direction: column; gap: 6px; }
      .gal-item { text-align: left; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--white); font-family: inherit; transition: border-color 0.15s; }
      .gal-item:hover { border-color: var(--line); }
      .gal-item[data-active="true"] { border-color: var(--red); }
      .gal-item b { font-size: 14px; display: block; }
      .gal-item span { font-size: 11px; color: var(--gray); }
      .gal-new { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .gal-new input { flex: 1; min-width: 140px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; color: var(--white); padding: 11px 12px; font-family: inherit; font-size: 13px; outline: none; }
      .gal-new input:focus { border-color: var(--red); }
      .gal-mini-btn { background: var(--red); color: #fff; border: none; border-radius: 9px; padding: 0 16px; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }
      .gal-mini-btn.ghost { background: transparent; border: 1px solid var(--line); color: rgba(255,255,255,0.8); }
      .gal-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
      .gal-meta select { background: var(--panel-2); border: 1px solid var(--line); color: var(--white); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 12.5px; }
      .gal-drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--gray); cursor: pointer; transition: border-color 0.18s, background 0.18s; font-size: 13.5px; }
      .gal-drop[data-over="true"] { border-color: var(--red); background: rgba(254,44,31,0.06); color: var(--white); }
      .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; }
      .gal-tile { position: relative; aspect-ratio: 4/5; border-radius: 9px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line-soft); }
      .gal-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .gal-tile[data-cover="true"] { outline: 2px solid var(--red); outline-offset: -2px; }
      .gal-tile-actions { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 6px; opacity: 0; transition: opacity 0.15s; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent 55%); }
      .gal-tile:hover .gal-tile-actions { opacity: 1; }
      .gal-chip { font-size: 10px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 6px; padding: 3px 7px; cursor: pointer; }
      .gal-chip:hover { background: var(--red); border-color: var(--red); }
      .gal-prog { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
      .gal-prog-row { font-size: 12px; color: var(--gray); }
      .gal-prog-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; margin-top: 3px; }
      .gal-prog-fill { height: 100%; background: var(--red); transition: width 0.2s; }
    </style>
    <link rel="stylesheet" href="/site-skin.css" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
