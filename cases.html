<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кейсы — видеопродакшн и фото для брендов | Yelyginn</title>
    <meta name="description" content="Кейсы видеопродакшна и фотосъёмки в Нижнем Новгороде: задача, решение, результат. Реальные проекты для брендов и бизнеса." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://yelyginn.ru/cases" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yelyginn.ru/cases" />
    <meta property="og:title" content="Кейсы — Yelyginn видеопродакшн" />
    <meta property="og:description" content="Реальные проекты: задача, решение, результат." />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root { --red:#fe2c1f; --black:#0a0a0a; --panel:#121212; --panel-2:#181818; --white:#f5f5f4; --gray:#8e8e8c; --line:rgba(255,255,255,0.1); --line-soft:rgba(255,255,255,0.06); color-scheme:dark; }
      *{box-sizing:border-box;} html,body{margin:0;padding:0;}
      body{background:var(--black);color:var(--white);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
      a{color:inherit;text-decoration:none;}
      .c-wrap{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px;}
      .c-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:30px;}
      .c-logo{font-size:14px;font-weight:800;letter-spacing:0.04em;} .c-logo span{color:var(--red);}
      .c-nav{display:flex;gap:18px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gray);}
      .c-nav a:hover{color:var(--white);}
      .c-eyebrow{font-size:11px;letter-spacing:0.35em;text-transform:uppercase;color:var(--red);margin-bottom:14px;}
      .c-title{font-size:clamp(32px,6vw,64px);line-height:0.98;letter-spacing:-0.03em;font-weight:800;text-transform:uppercase;margin:0 0 36px;}
      .c-title span{color:var(--red);}
      .c-list{display:flex;flex-direction:column;gap:16px;}
      .c-case{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:clamp(18px,3vw,28px);}
      .c-case h2{font-size:clamp(18px,2.6vw,26px);margin:0 0 4px;letter-spacing:-0.02em;}
      .c-client{font-size:12px;color:var(--red);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;}
      .c-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
      @media(max-width:680px){.c-blocks{grid-template-columns:1fr;}}
      .c-block-label{font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
      .c-block p{margin:0;font-size:13.5px;color:rgba(255,255,255,0.82);line-height:1.6;white-space:pre-wrap;}
      .c-link{display:inline-flex;margin-top:16px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);}
      .c-empty{color:var(--gray);text-align:center;padding:60px 0;}
      .c-cta{margin-top:40px;display:flex;gap:12px;flex-wrap:wrap;}
      .c-btn{background:var(--red);color:#fff;border-radius:10px;padding:14px 24px;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;}
      .c-btn.ghost{background:transparent;border:1px solid var(--line);color:rgba(255,255,255,0.8);}
    </style>
    <link rel="stylesheet" href="/site-skin.css" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cases/main.tsx"></script>
  </body>
</html>
