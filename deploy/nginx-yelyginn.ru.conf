server {
    listen 80;
    listen [::]:80;
    server_name www.yelyginn.ru;
    return 301 https://yelyginn.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name yelyginn.ru;
    return 301 https://yelyginn.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yelyginn.ru;

    ssl_certificate /etc/letsencrypt/live/yelyginn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yelyginn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yelyginn.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yelyginn.ru;

    ssl_certificate /etc/letsencrypt/live/yelyginn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yelyginn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yelyginn/dist;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/send-form {
        proxy_pass https://my-portfolio-github-copy.vercel.app/api/send-form;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host my-portfolio-github-copy.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
